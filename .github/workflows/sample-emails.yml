# "Run workflow" on the Actions tab sends a spread of sample emails (made-up data) to the address
# typed into the "to" box (or, if left empty, the SAMPLE_EMAIL_TO repository secret).
#
# It sends the code of the branch it is run on, so emails can be reviewed before they are
# deployed: the branch's backend code, the sample script and the email banners are copied to a
# temporary folder on the VPS (which has the SMTP settings), run there with the live backend's
# node_modules and .env, then deleted. The deployed app and the database are not touched.
#
# Uses the deploy secrets VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_KNOWN_HOSTS (see deploy.yml).
name: Send sample emails

on:
  workflow_dispatch:
    inputs:
      to:
        description: Address that receives the samples (leave empty to use the SAMPLE_EMAIL_TO secret)
        required: false
        type: string
      only:
        description: Send only samples whose name contains one of these words, comma-separated (e.g. reversal,kyc). Leave empty for all.
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    name: Send samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Send from the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SAMPLE_TO: ${{ inputs.to || secrets.SAMPLE_EMAIL_TO }}
          SAMPLE_ONLY: ${{ inputs.only }}
        run: |
          [ -n "$SAMPLE_TO" ] || { echo "Type an address in the \"to\" box, or add the SAMPLE_EMAIL_TO repository secret."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The branch's backend code, the sample script and the banners (assets/email/*.jpg).
          mkdir -p bundle/assets
          cp -R backend/src bundle/backend-src
          cp scripts/send-sample-emails.js bundle/
          cp -R frontend/public/email bundle/assets/email 2>/dev/null || true
          cp frontend/public/dwp-logo-dark.png bundle/assets/ 2>/dev/null || true

          TO_Q=$(printf '%q' "$SAMPLE_TO")
          ONLY_Q=$(printf '%q' "$SAMPLE_ONLY")
          tar -czf - -C bundle . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "
            set -e
            T=\$(mktemp -d)
            trap 'rm -rf \"\$T\"' EXIT
            tar -xzf - -C \"\$T\"
            mkdir -p \"\$T/backend\"
            mv \"\$T/backend-src\" \"\$T/backend/src\"
            ln -s /var/www/app/backend/node_modules \"\$T/backend/node_modules\"
            ln -s /var/www/app/backend/.env \"\$T/backend/.env\"
            # Inside the backend folder, so the script finds the backend's packages and .env.
            mv \"\$T/send-sample-emails.js\" \"\$T/backend/\"
            cd \"\$T/backend\"
            SAMPLE_TO=$TO_Q SAMPLE_ONLY=$ONLY_Q SAMPLE_ASSETS=\"\$T/assets\" node send-sample-emails.js
          "
