# Every push to `main` is tested, then deployed to the production VPS.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         server IP or hostname
#   VPS_USER         SSH user (root)
#   VPS_SSH_KEY      private key whose public half is in the server's ~/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS  the server's SSH host key line (ssh-keyscan output), so the connection is verified
#
# The deploy itself is scripts/deploy-vps.sh, run on the server. It rolls back automatically if the
# build, tests or health checks fail. "Run workflow" on the Actions tab redeploys on demand.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Frontend type check
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          # next-env.d.ts is generated by Next.js and git-ignored; tsc needs it for image imports.
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          npx tsc --noEmit

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "EXPECTED_SHA=$GITHUB_SHA bash -s" < scripts/deploy-vps.sh

      - name: Check the live site
        run: |
          for url in https://digitalwealthpartnersllc.net/api/health https://digitalwealthpartnersllc.net/contact https://digitalwealthpartnersllc.net/pay-onboarding; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ]
          done
